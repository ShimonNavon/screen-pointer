<!doctype html><meta charset="utf-8"><title>Screen Pointer demo</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#0e1116;color:#e9edf5;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
  .card{width:min(760px,80vw);background:#151a22;border:1px solid #232a35;border-radius:18px;padding:34px 38px;
        box-shadow:0 30px 80px rgba(0,0,0,.5)}
  h1{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
  p{color:#9aa4b2;margin:0 0 22px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:11px 18px;border-radius:11px;border:1px solid #2c3644;background:#1b2230;color:#dfe6f1;font-weight:600}
  .btn.primary{background:#f5c518;color:#1a1300;border-color:#f5c518}
  code{background:#1b2230;border:1px solid #2c3644;border-radius:6px;padding:2px 6px;font-size:14px}
</style>
<div class="card">
  <h1>Point at anything</h1>
  <p>The ring follows the cursor, and it shows up in screenshots and recordings.</p>
  <div class="row"><span class="btn primary">Record screen</span><span class="btn">Open last clip</span></div>
  <p style="margin-top:22px">Hotkeys <code>⌃⌥H</code> <code>⌃⌥D</code> <code>⌃⌥R</code></p>
</div>
