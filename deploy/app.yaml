apiVersion: v1
kind: Namespace
metadata: {name: screen-pointer}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: screen-pointer}
spec:
  replicas: 1
  selector: {matchLabels: {app: screen-pointer}}
  template:
    metadata: {labels: {app: screen-pointer}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.5-alpine
        ports: [{containerPort: 80}]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 200m, memory: 64Mi}}
        readinessProbe: {httpGet: {path: /, port: 80}}
        volumeMounts: [{name: site, mountPath: /usr/share/nginx/html}]
      volumes: [{name: site, configMap: {name: site}}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: screen-pointer}
spec:
  type: NodePort
  selector: {app: screen-pointer}
  ports: [{port: 80, targetPort: 80, nodePort: 30099}]
